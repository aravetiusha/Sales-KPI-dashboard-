<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sales KPI Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
body{font-family:Arial,sans-serif;background:#f5f5f5;margin:20px}
h1{text-align:center}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:15px}
.card{background:#fff;padding:15px;border-radius:10px;text-align:center}
.chart{background:#fff;padding:15px;border-radius:10px;margin-top:20px}
</style>
</head>
<body>
<h1>Sales KPI Dashboard</h1>
<div class="cards">
<div class="card"><h3>Total Sales</h3><h2>₹225,000</h2></div>
<div class="card"><h3>Total Profit</h3><h2>₹44,500</h2></div>
<div class="card"><h3>Total Orders</h3><h2>10</h2></div>
<div class="card"><h3>Total Quantity</h3><h2>33</h2></div>
</div>
<div class="chart"><canvas id="trend"></canvas></div>
<script>
new Chart(document.getElementById('trend'),{
type:'line',
data:{labels:['Jan','Feb','Mar'],datasets:[{label:'Sales',data:[107000,45000,73000]}]}
});
</script>
</body>
</html>
